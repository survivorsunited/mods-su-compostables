mod_issues=https://github.com/survivorsunited/mods-su-compostables/issues
mod_icon=assets/compostables/icon.png
# Mod Namespace
mod_namespace=su_compostables
# Main Class
main_class=org.survivorsunited.mods.compostables.Compostables

# Gradle Properties
maven_group=org.survivorsunited
jar_name=su-compostables

# Dependencies
fabric_version=0.145.1+26.1

